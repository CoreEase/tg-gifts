name: Download gift originals

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Re-download every original, including valid local files
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: write

concurrency:
  group: tg-gifts-originals
  cancel-in-progress: false

jobs:
  download:
    name: Download original images
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download original images
        env:
          REFRESH: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh || false }}
          ORIGINAL_DOWNLOAD_CONCURRENCY: '6'
        run: |
          if [[ "$REFRESH" == "true" ]]; then
            node scripts/download-originals.mjs --refresh
          else
            node scripts/download-originals.mjs
          fi

      - name: Commit downloaded originals
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gifts
          if git diff --cached --quiet; then
            echo "No new or changed originals to commit."
          else
            git commit -m "chore: download gift originals"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
