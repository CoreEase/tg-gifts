name: Download gift assets

on:
  workflow_dispatch:
    inputs:
      refresh_assets:
        description: Re-download every asset, including valid local files
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

concurrency:
  group: tg-gifts-asset-download
  cancel-in-progress: false

jobs:
  download:
    name: Download and commit assets
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download model and pattern assets
        env:
          REFRESH_ASSETS: ${{ github.event_name == 'workflow_dispatch' && inputs.refresh_assets || false }}
          ASSET_DOWNLOAD_CONCURRENCY: '6'
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$REFRESH_ASSETS" == "true" ]]; then
            node scripts/download-assets.mjs --refresh
          else
            node scripts/download-assets.mjs
          fi

      - name: Commit downloaded assets
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- gifts
          if git diff --cached --quiet; then
            echo "No new or changed assets to commit."
          else
            git commit -m "chore: download gift assets"
            git push origin "HEAD:${DEFAULT_BRANCH}"
          fi
